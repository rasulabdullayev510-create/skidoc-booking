<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Ski Doc — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1e;--bg2:#111827;--bg3:#1a2235;--bg4:#1f2d45;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#ffffff;--text2:rgba(255,255,255,0.6);--text3:rgba(255,255,255,0.3);
  --primary:#3b82f6;--primary-dark:#2563eb;--primary-glow:rgba(59,130,246,0.15);
  --green:#10b981;--green-bg:rgba(16,185,129,0.1);
  --yellow:#f59e0b;--yellow-bg:rgba(245,158,11,0.1);
  --red:#ef4444;--red-bg:rgba(239,68,68,0.1);
  --radius:14px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(59,130,246,0.08) 0%,transparent 70%)}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:48px 40px;width:100%;max-width:380px}
.login-logo{font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:32px}
.login-title{font-size:2rem;font-weight:800;margin-bottom:6px;letter-spacing:-0.02em}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:32px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3)}
.field input,.field select{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:12px 15px;font-family:'Outfit',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color 0.15s;-webkit-appearance:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--primary)}
.field input::placeholder{color:var(--text3)}
.btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.15s}
.btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn:disabled{opacity:0.4;cursor:default;transform:none}
.err{font-size:13px;color:var(--red);margin-top:12px;display:none;text-align:center}

/* App shell */
.app{display:none;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 16px;z-index:10}
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:36px}
.sb-brand-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sb-brand-name{font-size:14px;font-weight:700;color:var(--text)}
.sb-brand-sub{font-size:11px;color:var(--text3)}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all 0.15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:'Outfit',sans-serif}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--primary-glow);color:var(--primary);font-weight:600}
.nav-item-icon{width:18px;text-align:center;font-size:14px}
.sb-bottom{margin-top:auto}
.main{margin-left:220px;padding:40px;min-height:100vh}

.page-hdr{margin-bottom:32px}
.page-hdr h1{font-size:1.8rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px}
.page-hdr p{font-size:14px;color:var(--text2)}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-card.green::before{background:var(--green)}
.stat-card.blue::before{background:var(--primary)}
.stat-card.yellow::before{background:var(--yellow)}
.stat-lbl{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.stat-num{font-size:2.4rem;font-weight:800;letter-spacing:-0.03em;line-height:1;margin-bottom:6px}
.stat-num.green{color:var(--green)}
.stat-num.blue{color:var(--primary)}
.stat-num.yellow{color:var(--yellow)}
.stat-sub{font-size:12px;color:var(--text3)}

.charts-row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text3);margin-bottom:20px}

.schedule-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;max-height:320px;overflow-y:auto}
.sched-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg3);border-radius:10px;border:1px solid var(--border)}
.sched-date{font-size:11px;font-weight:700;color:var(--primary);min-width:60px}
.sched-time{font-size:11px;color:var(--text3);min-width:54px}
.sched-name{font-size:13px;font-weight:600;flex:1}
.sched-svc{font-size:11px;color:var(--text2)}
.sched-price{font-size:13px;font-weight:700;color:var(--green)}
.no-sched{font-size:13px;color:var(--text3);text-align:center;padding:32px 0}

.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:20px}
.table-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.table-head-title{font-size:14px;font-weight:700}
.tab-row{display:flex;gap:8px;flex-wrap:wrap}
.tab-btn{padding:7px 16px;border-radius:8px;border:1.5px solid var(--border2);background:transparent;color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
.tab-btn.active{border-color:var(--primary);background:var(--primary-glow);color:var(--primary)}
table{width:100%;border-collapse:collapse;min-width:480px}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:12px 16px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase}
.badge-confirmed{background:rgba(59,130,246,0.15);color:var(--primary)}
.badge-pending{background:var(--yellow-bg);color:var(--yellow)}
.badge-denied,.badge-cancelled{background:var(--red-bg);color:var(--red)}
.badge-denied_awaiting_offer,.badge-offer_sent{background:var(--yellow-bg);color:var(--yellow)}

.form-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px}
.form-card h3{font-size:15px;font-weight:700;margin-bottom:4px}
.form-card p{font-size:13px;color:var(--text2);margin-bottom:24px}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}
.form-row .field{margin-bottom:0}
.btn-sm{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all 0.15s;height:44px}
.btn-sm:hover{background:var(--primary-dark)}
.form-msg{font-size:13px;margin-top:12px;display:none}
.form-msg.ok{color:var(--green)}
.form-msg.fail{color:var(--red)}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

.mob-header{display:none;align-items:center;gap:12px;height:56px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;flex-shrink:0;width:100%}
.mob-btn{background:none;border:none;font-size:22px;color:var(--text);cursor:pointer;padding:8px;border-radius:8px;font-family:inherit;line-height:1}
.mob-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:24;display:none}
.mob-overlay.open{display:block}

@media(max-width:900px){
  .mob-header{display:flex}
  .sidebar{left:-260px;transition:left 0.25s ease;z-index:25;top:0}
  .sidebar.open{left:0;box-shadow:8px 0 32px rgba(0,0,0,0.35)}
  .main{margin-left:0;padding:24px}
  .stats-row{grid-template-columns:1fr 1fr}
  .charts-row{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr!important}
}
@media(max-width:640px){
  .main{padding:14px}
  .page-hdr{margin-bottom:18px}
  .page-hdr h1{font-size:1.35rem}
  .page-hdr p{font-size:13px}
  .stats-row{grid-template-columns:1fr 1fr!important;gap:10px;margin-bottom:16px}
  .stat-card{padding:16px 14px}
  .stat-num{font-size:1.5rem}
  .stat-lbl{font-size:10px;margin-bottom:8px}
  .stat-sub{font-size:11px}
  .chart-card,.form-card{padding:16px}
  .card-title{font-size:13px}
  .field input,.field select{font-size:16px}
  .login-box{padding:24px 18px}
  .login-title{font-size:1.5rem}
  .login-sub{font-size:13px}
  .btn-sm{font-size:12px;padding:10px 14px}
  td,th{padding:10px;font-size:12px}
  .table-head{padding:14px 16px}
  .schedule-list{max-height:none}
}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mob-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.mob-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px}
.mob-card-date{font-size:12px;color:var(--primary);font-weight:700}
.mob-card-name{font-weight:700;font-size:15px;margin-bottom:2px}
.mob-card-sub{font-size:12px;color:var(--text3);margin-bottom:6px}
.mob-card-meta{font-size:12px;color:var(--text2);line-height:1.7}
.mob-empty{text-align:center;color:var(--text3);padding:30px;font-size:13px}
.mob-cards-wrap{padding:14px 16px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-box">
    <div class="login-logo">Ski Doc — Admin Portal</div>
    <div class="login-title">Welcome back</div>
    <p class="login-sub">Enter your password to access your dashboard.</p>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()" autocomplete="current-password"/>
    </div>
    <button class="btn" onclick="login()" id="login-btn">Access Dashboard</button>
    <div class="err" id="err">Wrong password or couldn't connect.</div>
  </div>
</div>

<div class="app" id="app">
  <div class="mob-header" id="mob-header">
    <button class="mob-btn" onclick="toggleMobileMenu()">☰</button>
    <span id="mob-page-title" style="font-size:14px;font-weight:700;flex:1">Overview</span>
  </div>
  <div class="mob-overlay" id="mob-overlay" onclick="toggleMobileMenu()"></div>

  <div class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div>
        <div class="sb-brand-name">Ski Doc</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:3px">
          <div class="sb-brand-dot"></div>
          <div class="sb-brand-sub">Live</div>
        </div>
      </div>
    </div>

    <button class="nav-item active" onclick="showPage('overview',this)">
      <span class="nav-item-icon">◈</span> Overview
    </button>
    <button class="nav-item" onclick="showPage('bookings',this)">
      <span class="nav-item-icon">☰</span> Bookings
    </button>
    <button class="nav-item" onclick="showPage('walkins',this)">
      <span class="nav-item-icon">＋</span> Walk-ins
    </button>
    <button class="nav-item" onclick="showPage('reviews',this)">
      <span class="nav-item-icon">★</span> Reviews
    </button>

    <div class="sb-bottom">
      <button class="nav-item" onclick="showPage('danger',this)">
        <span class="nav-item-icon">⚠</span> Danger Zone
      </button>
      <button class="nav-item" onclick="logout()">
        <span class="nav-item-icon">⏻</span> Log Out
      </button>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const API = window.location.origin;
let pwd = '', stats = null, bookings = [], walkins = [], feedback = [];
let currentPeriod = 'today', currentBookingsFilter = 'all';

async function login() {
  pwd = document.getElementById('pwd').value.trim();
  if (!pwd) { showErr('Enter your password.'); return; }
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Connecting...'; btn.disabled = true;
  try {
    const [sr, br, wr, fr] = await Promise.all([
      fetch(API + '/api/analytics?password=' + encodeURIComponent(pwd)),
      fetch(API + '/api/bookings?password=' + encodeURIComponent(pwd)),
      fetch(API + '/api/walkins?password=' + encodeURIComponent(pwd)),
      fetch(API + '/api/feedback?password=' + encodeURIComponent(pwd)),
    ]);
    if (sr.status === 401) { showErr('Wrong password.'); btn.textContent = 'Access Dashboard'; btn.disabled = false; return; }
    stats = await sr.json();
    bookings = await br.json();
    walkins = await wr.json();
    feedback = await fr.json();
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    renderOverview();
  } catch (e) {
    showErr('Could not connect. Try again.');
    btn.textContent = 'Access Dashboard'; btn.disabled = false;
  }
}

function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg; e.style.display = 'block';
}

const PAGE_TITLES = { overview: 'Overview', bookings: 'Bookings', walkins: 'Walk-ins', reviews: 'Reviews', danger: 'Danger Zone' };

function showPage(page, el) {
  document.querySelectorAll('.nav-item').forEach((n) => n.classList.remove('active'));
  if (el) el.classList.add('active');
  const t = document.getElementById('mob-page-title');
  if (t) t.textContent = PAGE_TITLES[page] || page;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mob-overlay').classList.remove('open');
  if (page === 'overview') renderOverview();
  else if (page === 'bookings') renderBookings();
  else if (page === 'walkins') renderWalkins();
  else if (page === 'reviews') renderReviews();
  else if (page === 'danger') renderDanger();
}

function toggleMobileMenu() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mob-overlay').classList.toggle('open');
}

function fmt12(t) {
  if (!t) return '—';
  const [h, m] = t.split(':'); const hr = parseInt(h);
  return (hr > 12 ? hr - 12 : hr || 12) + ':' + m + ' ' + (hr >= 12 ? 'PM' : 'AM');
}
function fmtDate(d) {
  const [y, mo, day] = d.split('-');
  return MONTHS[parseInt(mo) - 1] + ' ' + parseInt(day);
}
function locLabel(b) {
  if (b.location === 'mobile') return '🚐 Mobile' + (b.address ? ' · ' + b.address : '');
  return '📍 ' + (b.locationName || 'In-Shop');
}

// ── Overview ─────────────────────────────────────────────────
function renderOverview(period) {
  period = period || currentPeriod;
  currentPeriod = period;
  const today = new Date().toISOString().split('T')[0];
  const confirmed = bookings.filter((b) => b.status === 'confirmed');
  const tabStyle = (p) => `padding:8px 18px;border-radius:8px;border:1.5px solid ${period === p ? 'var(--primary)' : 'var(--border2)'};background:${period === p ? 'var(--primary-glow)' : 'transparent'};color:${period === p ? 'var(--primary)' : 'var(--text2)'};font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s`;
  const tabs = `<div style="display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap">
    <button style="${tabStyle('today')}" onclick="renderOverview('today')">Today</button>
    <button style="${tabStyle('week')}" onclick="renderOverview('week')">This Week</button>
    <button style="${tabStyle('alltime')}" onclick="renderOverview('alltime')">All Time</button>
  </div>`;

  if (period === 'today') {
    const todayBks = confirmed.filter((b) => b.date === today).sort((a, b) => a.time.localeCompare(b.time));
    const revenue = todayBks.reduce((s, b) => s + b.servicePrice, 0);
    const mobileC = todayBks.filter((b) => b.location === 'mobile').length;
    const dateStr = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    document.getElementById('main').innerHTML = `
      <div class="page-hdr"><h1>Overview</h1><p>${dateStr}</p></div>
      ${tabs}
      <div class="stats-row" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat-card green"><div class="stat-lbl">Revenue Today</div><div class="stat-num green">$${revenue.toLocaleString()}</div><div class="stat-sub">${todayBks.length} booking${todayBks.length !== 1 ? 's' : ''}</div></div>
        <div class="stat-card blue"><div class="stat-lbl">Appointments</div><div class="stat-num blue">${todayBks.length}</div><div class="stat-sub">Scheduled today</div></div>
        <div class="stat-card yellow"><div class="stat-lbl">Mobile Jobs</div><div class="stat-num yellow">${mobileC}</div><div class="stat-sub">${todayBks.length - mobileC} in-shop</div></div>
      </div>
      <div class="chart-card">
        <div class="card-title">Today's Schedule</div>
        <div class="card-sub">${dateStr}</div>
        <div style="margin-top:16px">
          ${todayBks.length ? todayBks.map((b) => `<div style="display:flex;align-items:flex-start;gap:14px;padding:16px;background:var(--bg3);border-radius:12px;border:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap">
              <div style="text-align:center;min-width:52px;padding-top:2px">
                <div style="font-size:16px;font-weight:800;color:var(--primary)">${fmt12(b.time).replace(' AM', '').replace(' PM', '')}</div>
                <div style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:0.06em">${fmt12(b.time).includes('AM') ? 'AM' : 'PM'}</div>
              </div>
              <div style="flex:1;min-width:160px">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px">
                  <div style="font-size:15px;font-weight:700">${b.customerName}</div>
                  <div style="font-size:16px;font-weight:800;color:var(--green);white-space:nowrap">$${b.servicePrice}</div>
                </div>
                <div style="font-size:13px;color:var(--text2);margin-bottom:8px">${b.serviceName}</div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                  <span style="background:${b.location === 'mobile' ? 'rgba(245,158,11,0.12)' : 'rgba(59,130,246,0.1)'};color:${b.location === 'mobile' ? 'var(--yellow)' : 'var(--primary)'};font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px">${locLabel(b)}</span>
                  ${b.phone ? `<span style="font-size:11px;color:var(--text3)">${b.phone}</span>` : ''}
                </div>
              </div>
            </div>`).join('') : `<div style="text-align:center;padding:52px 20px;color:var(--text3)">
            <div style="font-size:36px;margin-bottom:12px">📅</div>
            <div style="font-size:15px;font-weight:700;color:var(--text2);margin-bottom:6px">No appointments today</div>
          </div>`}
        </div>
      </div>`;
    return;
  }

  if (period === 'week') {
    const day = new Date().getDay();
    const mondayOffset = day === 0 ? -6 : 1 - day;
    const weekDays = Array.from({ length: 7 }, (_, i) => {
      const dd = new Date(); dd.setDate(dd.getDate() + mondayOffset + i);
      return dd.toISOString().split('T')[0];
    });
    const weekBks = confirmed.filter((b) => b.date >= weekDays[0] && b.date <= weekDays[6]);
    const revenue = weekBks.reduce((s, b) => s + b.servicePrice, 0);
    const upcoming = weekBks.filter((b) => b.date >= today).sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
    const upcomingRev = upcoming.reduce((s, b) => s + b.servicePrice, 0);
    document.getElementById('main').innerHTML = `
      <div class="page-hdr"><h1>Overview</h1><p>This week at a glance</p></div>
      ${tabs}
      <div class="stats-row">
        <div class="stat-card green"><div class="stat-lbl">Revenue This Week</div><div class="stat-num green">$${revenue.toLocaleString()}</div><div class="stat-sub">Confirmed bookings</div></div>
        <div class="stat-card blue"><div class="stat-lbl">Upcoming Revenue</div><div class="stat-num blue">$${upcomingRev.toLocaleString()}</div><div class="stat-sub">${upcoming.length} appointment${upcoming.length !== 1 ? 's' : ''} left</div></div>
        <div class="stat-card blue"><div class="stat-lbl">Bookings</div><div class="stat-num blue">${weekBks.length}</div><div class="stat-sub">This week total</div></div>
        <div class="stat-card yellow"><div class="stat-lbl">Avg Rating</div><div class="stat-num yellow">${stats.avgRating || '—'}</div><div class="stat-sub">All-time average</div></div>
      </div>
      <div class="charts-row">
        <div class="chart-card">
          <div class="card-title">Revenue — This Week</div>
          <div class="card-sub">Daily revenue Mon–Sun</div>
          <canvas id="rev-chart" height="100"></canvas>
        </div>
        <div class="chart-card">
          <div class="card-title">Upcoming This Week</div>
          <div class="card-sub">${upcoming.length} appointment${upcoming.length !== 1 ? 's' : ''} remaining</div>
          <div class="schedule-list">
            ${upcoming.length ? upcoming.slice(0, 8).map((b) => `<div class="sched-item">
                <span class="sched-date">${fmtDate(b.date)}</span>
                <span class="sched-time">${fmt12(b.time)}</span>
                <div style="flex:1"><div class="sched-name">${b.customerName}</div><div class="sched-svc">${locLabel(b)}</div></div>
                <span class="sched-price">$${b.servicePrice}</span>
              </div>`).join('') : '<div class="no-sched">No more appointments this week</div>'}
          </div>
        </div>
      </div>`;
    setTimeout(() => {
      const ctx = document.getElementById('rev-chart');
      if (!ctx) return;
      new Chart(ctx.getContext('2d'), {
        type: 'bar',
        data: {
          labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
          datasets: [{
            data: weekDays.map((d) => weekBks.filter((b) => b.date === d).reduce((s, b) => s + b.servicePrice, 0)),
            backgroundColor: weekDays.map((d) => d === today ? 'rgba(59,130,246,0.55)' : 'rgba(59,130,246,0.2)'),
            borderColor: weekDays.map((d) => d === today ? 'rgba(59,130,246,1)' : 'rgba(59,130,246,0.6)'),
            borderWidth: 1.5, borderRadius: 6,
          }],
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: {
          x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: 'rgba(255,255,255,0.3)', font: { size: 11 } } },
          y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: 'rgba(255,255,255,0.3)', font: { size: 11 }, callback: (v) => '$' + v } },
        } },
      });
    }, 50);
    return;
  }

  // All time
  const upcoming = confirmed.filter((b) => b.date >= today).sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
  document.getElementById('main').innerHTML = `
    <div class="page-hdr"><h1>Overview</h1><p>All-time performance</p></div>
    ${tabs}
    <div class="stats-row">
      <div class="stat-card green"><div class="stat-lbl">Total Revenue</div><div class="stat-num green">$${(stats.totalRevenue || 0).toLocaleString()}</div><div class="stat-sub">From confirmed bookings</div></div>
      <div class="stat-card blue"><div class="stat-lbl">Total Bookings</div><div class="stat-num blue">${stats.totalBookings || 0}</div><div class="stat-sub">All time confirmed</div></div>
      <div class="stat-card yellow"><div class="stat-lbl">Avg Rating</div><div class="stat-num yellow">${stats.avgRating || '—'}</div><div class="stat-sub">From review flow</div></div>
      <div class="stat-card blue"><div class="stat-lbl">Review Rate</div><div class="stat-num">${stats.reviewRate || 0}%</div><div class="stat-sub">Industry avg ~8%</div></div>
    </div>
    <div class="stats-row" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card blue"><div class="stat-lbl">Walk-ins</div><div class="stat-num">${walkins.length}</div><div class="stat-sub">Manually added</div></div>
      <div class="stat-card green"><div class="stat-lbl">Total Reviews</div><div class="stat-num green">${feedback.length}</div><div class="stat-sub">Collected via SMS</div></div>
      <div class="stat-card blue"><div class="stat-lbl">Upcoming</div><div class="stat-num">${upcoming.length}</div><div class="stat-sub">Confirmed, not yet done</div></div>
    </div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="card-title">Revenue — Last 14 Days</div>
        <div class="card-sub">Daily revenue from confirmed bookings</div>
        <canvas id="rev-chart" height="100"></canvas>
      </div>
      <div class="chart-card">
        <div class="card-title">Upcoming Appointments</div>
        <div class="card-sub">${upcoming.length} confirmed</div>
        <div class="schedule-list">
          ${upcoming.length ? upcoming.slice(0, 8).map((b) => `<div class="sched-item">
              <span class="sched-date">${fmtDate(b.date)}</span>
              <span class="sched-time">${fmt12(b.time)}</span>
              <div style="flex:1"><div class="sched-name">${b.customerName}</div><div class="sched-svc">${locLabel(b)}</div></div>
              <span class="sched-price">$${b.servicePrice}</span>
            </div>`).join('') : '<div class="no-sched">No upcoming bookings</div>'}
        </div>
      </div>
    </div>`;
  setTimeout(() => {
    const ctx = document.getElementById('rev-chart');
    if (!ctx || !stats.revenueByDay) return;
    const days = Object.keys(stats.revenueByDay);
    new Chart(ctx.getContext('2d'), {
      type: 'line',
      data: {
        labels: days.map((d) => { const [, m, day] = d.split('-'); return `${parseInt(m)}/${parseInt(day)}`; }),
        datasets: [{
          data: days.map((d) => stats.revenueByDay[d]),
          borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.08)',
          borderWidth: 2, tension: 0.4, fill: true, pointRadius: 0, pointHoverRadius: 4,
        }],
      },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: 'rgba(255,255,255,0.3)', font: { size: 11 } } },
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: 'rgba(255,255,255,0.3)', font: { size: 11 }, callback: (v) => '$' + v } },
      } },
    });
  }, 50);
}

// ── Bookings ─────────────────────────────────────────────────
function renderBookings(filter) {
  filter = filter || currentBookingsFilter;
  currentBookingsFilter = filter;
  const list = filter === 'all' ? bookings : bookings.filter((b) => b.status === filter);
  const mob = window.innerWidth < 640;

  const listContent = mob
    ? `<div class="mob-cards-wrap">${list.length ? list.map((b) => `<div class="mob-card">
          <div class="mob-card-top">
            <span class="badge badge-${b.status}">${b.status.replace(/_/g, ' ')}</span>
            <span style="font-family:monospace;font-size:11px;color:var(--text3)">#${b.shortId || b.id.slice(-6)}</span>
          </div>
          <div class="mob-card-name">${b.customerName}</div>
          <div class="mob-card-sub">${b.phone || '—'}</div>
          <div class="mob-card-meta">
            ${b.serviceName}<br>
            ${locLabel(b)}<br>
            ${b.date} · ${fmt12(b.time)} · <span style="color:var(--green);font-weight:700">$${b.servicePrice}</span>
          </div>
        </div>`).join('') : '<div class="mob-empty">No bookings in this category</div>'}</div>`
    : `<table>
        <thead><tr><th>ID</th><th>Customer</th><th>Service</th><th>Location</th><th>Date</th><th>Time</th><th>Price</th><th>Status</th></tr></thead>
        <tbody>${list.length ? list.map((b) => `<tr>
          <td style="font-family:monospace;font-size:11px;color:var(--text3)">${b.shortId || b.id.slice(-6)}</td>
          <td><div style="font-weight:600">${b.customerName}</div><div style="font-size:11px;color:var(--text3)">${b.phone || ''}</div></td>
          <td style="color:var(--text2)">${b.serviceName}</td>
          <td style="color:var(--text2)">${locLabel(b)}</td>
          <td style="color:var(--text3)">${b.date}</td>
          <td style="color:var(--text3)">${fmt12(b.time)}</td>
          <td style="font-weight:700;color:var(--green)">$${b.servicePrice}</td>
          <td><span class="badge badge-${b.status}">${b.status.replace(/_/g, ' ')}</span></td>
        </tr>`).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:40px">No bookings in this category</td></tr>'}
        </tbody>
      </table>`;

  const tabStyle = (f) => `tab-btn${filter === f ? ' active' : ''}`;
  document.getElementById('main').innerHTML = `
    <div class="page-hdr"><h1>Bookings</h1><p>${bookings.length} total</p></div>
    <div class="table-wrap">
      <div class="table-head">
        <span class="table-head-title">All Bookings</span>
        <div class="tab-row">
          <button class="${tabStyle('all')}" onclick="renderBookings('all')">All</button>
          <button class="${tabStyle('pending')}" onclick="renderBookings('pending')">Pending</button>
          <button class="${tabStyle('confirmed')}" onclick="renderBookings('confirmed')">Confirmed</button>
          <button class="${tabStyle('denied')}" onclick="renderBookings('denied')">Denied</button>
        </div>
      </div>
      ${listContent}
    </div>`;
}

// ── Walk-ins ─────────────────────────────────────────────────
function renderWalkins() {
  const mob = window.innerWidth < 640;
  const listContent = mob
    ? `<div class="mob-cards-wrap">${walkins.length ? walkins.map((w) => `<div class="mob-card">
          <div class="mob-card-name">${w.customerName}</div>
          <div class="mob-card-sub">${w.phone}</div>
          <div class="mob-card-meta">${w.serviceName}<br>${new Date(w.createdAt).toLocaleDateString()}<br>${w.reviewSentAt ? '<span class="badge badge-confirmed">Review sent</span>' : '<span class="badge badge-pending">Pending</span>'}</div>
        </div>`).join('') : '<div class="mob-empty">No walk-ins logged yet</div>'}</div>`
    : `<table>
        <thead><tr><th>Customer</th><th>Service</th><th>Added</th><th>Review SMS</th></tr></thead>
        <tbody>${walkins.length ? walkins.map((w) => `<tr>
          <td style="font-weight:600">${w.customerName}</td>
          <td style="color:var(--text2)">${w.serviceName}</td>
          <td style="color:var(--text3)">${new Date(w.createdAt).toLocaleDateString()}</td>
          <td>${w.reviewSentAt ? '<span class="badge badge-confirmed">Sent</span>' : '<span class="badge badge-pending">Pending</span>'}</td>
        </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:40px">No walk-ins logged yet</td></tr>'}
        </tbody>
      </table>`;

  document.getElementById('main').innerHTML = `
    <div class="page-hdr"><h1>Walk-ins</h1><p>Customers added manually for review follow-up</p></div>
    <div class="form-card">
      <h3>Add a walk-in</h3>
      <p>They'll get a review-request text 24 hours after being added.</p>
      <div class="form-row">
        <div class="field"><label>Name</label><input type="text" id="wk-name" placeholder="Customer name"/></div>
        <div class="field"><label>Phone</label><input type="tel" id="wk-phone" placeholder="(403) 555-0123"/></div>
        <div class="field"><label>Service</label><input type="text" id="wk-service" placeholder="e.g. Edge Sharpening"/></div>
        <button class="btn-sm" onclick="addWalkin()">Add</button>
      </div>
      <div class="form-msg" id="wk-msg"></div>
    </div>
    <div class="table-wrap">
      <div class="table-head"><span class="table-head-title">All Walk-ins</span></div>
      ${listContent}
    </div>`;
}

async function addWalkin() {
  const name = document.getElementById('wk-name').value.trim();
  const phone = document.getElementById('wk-phone').value.trim();
  const service = document.getElementById('wk-service').value.trim();
  const msg = document.getElementById('wk-msg');
  if (!name || !phone) { msg.className = 'form-msg fail'; msg.textContent = 'Name and phone required.'; msg.style.display = 'block'; return; }
  try {
    const r = await fetch(API + '/api/walkins', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ customerName: name, phone, serviceName: service }) });
    const data = await r.json();
    if (data.success) {
      msg.className = 'form-msg ok'; msg.textContent = 'Walk-in added.'; msg.style.display = 'block';
      const wr = await fetch(API + '/api/walkins?password=' + encodeURIComponent(pwd));
      walkins = await wr.json();
      renderWalkins();
    } else { msg.className = 'form-msg fail'; msg.textContent = data.error || 'Failed to add.'; msg.style.display = 'block'; }
  } catch (e) { msg.className = 'form-msg fail'; msg.textContent = 'Connection error.'; msg.style.display = 'block'; }
}

// ── Reviews ──────────────────────────────────────────────────
function renderReviews() {
  const starBar = (r) => '★'.repeat(r) + '☆'.repeat(5 - r);
  const starColor = (r) => r >= 4 ? 'var(--green)' : r === 3 ? 'var(--yellow)' : 'var(--red)';
  const fmtTs = (iso) => { const d = new Date(iso); return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };

  const cards = feedback.length
    ? feedback.map((f) => `<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:36px;height:36px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--text)">${(f.customerName || '?')[0].toUpperCase()}</div>
            <div>
              <div style="font-weight:600;font-size:14px">${f.customerName || 'Customer'}</div>
              <div style="font-size:11px;color:var(--text3)">${f.serviceName || ''}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="color:${starColor(f.rating)};font-size:15px;letter-spacing:1px">${starBar(f.rating)}</span>
            <span style="font-size:11px;color:var(--text3)">${fmtTs(f.submittedAt)}</span>
            ${f.rating >= 4
              ? `<span style="background:var(--green-bg);color:var(--green);font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:0.05em">→ GOOGLE</span>`
              : `<span style="background:var(--red-bg);color:var(--red);font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:0.05em">PRIVATE</span>`}
          </div>
        </div>
        ${f.comment ? `<p style="font-size:13px;color:var(--text2);line-height:1.6;margin-top:4px;padding-top:12px;border-top:1px solid var(--border)">"${f.comment}"</p>` : ''}
      </div>`).join('')
    : `<div style="text-align:center;color:var(--text3);padding:60px 20px;background:var(--bg3);border-radius:var(--radius)">No reviews yet — they'll appear here after customers submit feedback.</div>`;

  document.getElementById('main').innerHTML = `
    <div class="page-hdr"><h1>Reviews</h1><p>Automated follow-up performance</p></div>
    <div class="stats-row" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card yellow"><div class="stat-lbl">Avg Rating</div><div class="stat-num yellow">${stats.avgRating || '—'}</div><div class="stat-sub">From review system</div></div>
      <div class="stat-card blue"><div class="stat-lbl">Review Rate</div><div class="stat-num blue">${stats.reviewRate || 0}%</div><div class="stat-sub">Industry average ~8%</div></div>
      <div class="stat-card green"><div class="stat-lbl">Total Reviews</div><div class="stat-num green">${feedback.length}</div><div class="stat-sub">SMS fires 24h after appointment</div></div>
    </div>
    <div class="form-card" style="margin-bottom:20px">
      <h3>How the review funnel works</h3>
      <p style="margin-bottom:12px">Every booking and walk-in automatically triggers a review SMS 24 hours after the appointment. 4–5 stars redirects to Google, 1–3 stars stays private here.</p>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        ${[['1', 'Appointment done'], ['→', ''], ['2', 'SMS fires +24h'], ['→', ''], ['4-5★', '→ Google review'], ['→', ''], ['1-3★', '→ Private feedback']].map(([l, t]) =>
          t ? `<div style="background:var(--bg3);border-radius:10px;padding:12px 16px"><div style="font-size:18px;font-weight:800;color:var(--text)">${l}</div><div style="font-size:11px;color:var(--text3);margin-top:3px">${t}</div></div>`
            : `<div style="color:var(--text3);font-size:18px">${l}</div>`).join('')}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">${cards}</div>`;
}

// ── Danger Zone ──────────────────────────────────────────────
function renderDanger() {
  document.getElementById('main').innerHTML = `
    <div class="page-hdr"><h1>Danger Zone</h1><p>Irreversible actions — use with care</p></div>
    <div class="form-card" style="border-color:var(--red)">
      <h3 style="color:var(--red)">Wipe all data</h3>
      <p>Permanently deletes every booking, walk-in, and review. This cannot be undone. Type <strong>DELETE</strong> below to confirm.</p>
      <div class="form-row" style="grid-template-columns:1fr auto">
        <div class="field"><label>Confirm</label><input type="text" id="wipe-confirm" placeholder="Type DELETE"/></div>
        <button class="btn-sm" style="background:var(--red)" onclick="wipeData()">Wipe All Data</button>
      </div>
      <div class="form-msg" id="wipe-msg"></div>
    </div>`;
}

async function wipeData() {
  const val = document.getElementById('wipe-confirm').value.trim();
  const msg = document.getElementById('wipe-msg');
  if (val !== 'DELETE') { msg.className = 'form-msg fail'; msg.textContent = 'Type DELETE exactly to confirm.'; msg.style.display = 'block'; return; }
  try {
    const r = await fetch(API + '/api/wipe-data?password=' + encodeURIComponent(pwd), { method: 'POST' });
    const data = await r.json();
    if (data.success) {
      bookings = []; walkins = []; feedback = [];
      msg.className = 'form-msg ok'; msg.textContent = 'All data wiped.'; msg.style.display = 'block';
      setTimeout(() => showPage('overview', document.querySelector('.nav-item')), 800);
    } else { msg.className = 'form-msg fail'; msg.textContent = data.error || 'Failed.'; msg.style.display = 'block'; }
  } catch (e) { msg.className = 'form-msg fail'; msg.textContent = 'Connection error.'; msg.style.display = 'block'; }
}

function logout() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('pwd').value = '';
  pwd = ''; bookings = []; walkins = []; feedback = []; stats = null;
}
</script>
</body>
</html>
