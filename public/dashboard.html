<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Ski Doc — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1e;--bg2:#111827;--bg3:#1a2235;--bg4:#1f2d45;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#ffffff;--text2:rgba(255,255,255,0.6);--text3:rgba(255,255,255,0.3);
  --primary:#3b82f6;--primary-dark:#2563eb;--primary-glow:rgba(59,130,246,0.15);
  --green:#10b981;--green-bg:rgba(16,185,129,0.1);
  --yellow:#f59e0b;--yellow-bg:rgba(245,158,11,0.1);
  --red:#ef4444;--red-bg:rgba(239,68,68,0.1);
  --radius:14px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(59,130,246,0.08) 0%,transparent 70%)}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:48px 40px;width:100%;max-width:380px}
.login-logo{font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:32px}
.login-title{font-size:2rem;font-weight:800;margin-bottom:6px;letter-spacing:-0.02em}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:32px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3)}
.field input,.field select{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:12px 15px;font-family:'Outfit',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color 0.15s;-webkit-appearance:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--primary)}
.field input::placeholder{color:var(--text3)}
.btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.15s}
.btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn:disabled{opacity:0.4;cursor:default;transform:none}
.err{font-size:13px;color:var(--red);margin-top:12px;display:none;text-align:center}

.app{display:none;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:230px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 16px;z-index:10;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:28px}
.sb-brand-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sb-brand-name{font-size:14px;font-weight:700;color:var(--text)}
.sb-brand-sub{font-size:11px;color:var(--text3)}
.sb-section{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);padding:0 10px;margin:18px 0 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all 0.15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:'Outfit',sans-serif}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--primary-glow);color:var(--primary);font-weight:600}
.nav-item-icon{width:18px;text-align:center;font-size:14px}
.sb-bottom{margin-top:auto}
.main{margin-left:230px;padding:40px;min-height:100vh}

.page-hdr{margin-bottom:32px}
.page-hdr h1{font-size:1.8rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px}
.page-hdr p{font-size:14px;color:var(--text2)}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-card.green::before{background:var(--green)}
.stat-card.blue::before{background:var(--primary)}
.stat-card.yellow::before{background:var(--yellow)}
.stat-card.red::before{background:var(--red)}
.stat-lbl{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.stat-num{font-size:2.4rem;font-weight:800;letter-spacing:-0.03em;line-height:1;margin-bottom:6px}
.stat-num.green{color:var(--green)}
.stat-num.blue{color:var(--primary)}
.stat-num.yellow{color:var(--yellow)}
.stat-sub{font-size:12px;color:var(--text3)}

.charts-row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text3);margin-bottom:20px}

.schedule-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;max-height:320px;overflow-y:auto}
.sched-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg3);border-radius:10px;border:1px solid var(--border)}
.sched-date{font-size:11px;font-weight:700;color:var(--primary);min-width:60px}
.sched-time{font-size:11px;color:var(--text3);min-width:54px}
.sched-name{font-size:13px;font-weight:600;flex:1}
.sched-svc{font-size:11px;color:var(--text2)}
.sched-price{font-size:13px;font-weight:700;color:var(--green)}
.no-sched{font-size:13px;color:var(--text3);text-align:center;padding:32px 0}

.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:20px}
.table-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.table-head-title{font-size:14px;font-weight:700}
table{width:100%;border-collapse:collapse;min-width:480px}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:12px 16px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase}
.badge-confirmed{background:rgba(59,130,246,0.15);color:var(--primary)}
.badge-pending{background:var(--yellow-bg);color:var(--yellow)}
.badge-denied,.badge-cancelled{background:var(--red-bg);color:var(--red)}
.badge-denied_awaiting_offer,.badge-offer_sent{background:var(--yellow-bg);color:var(--yellow)}
.badge-sent{background:var(--green-bg);color:var(--green)}
.badge-noshow{background:rgba(239,68,68,0.12);color:var(--red)}

.form-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px}
.form-card h3{font-size:15px;font-weight:700;margin-bottom:4px}
.form-card p{font-size:13px;color:var(--text2);margin-bottom:24px}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}
.form-row .field{margin-bottom:0}
.btn-sm{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all 0.15s;height:44px}
.btn-sm:hover{background:var(--primary-dark)}
.form-msg{font-size:13px;margin-top:12px;display:none}
.form-msg.ok{color:var(--green)}
.form-msg.fail{color:var(--red)}

.conv-meter{margin-top:12px}
.conv-bar-bg{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.conv-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--green));transition:width 1s ease}
.conv-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}

.traffic-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.traffic-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.traffic-num{font-size:1.8rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px}
.traffic-lbl{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.08em}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

.mob-header{display:none;align-items:center;gap:12px;height:56px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;flex-shrink:0;width:100%}
.mob-btn{background:none;border:none;font-size:22px;color:var(--text);cursor:pointer;padding:8px;border-radius:8px;font-family:inherit;line-height:1}
.mob-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:24;display:none}
.mob-overlay.open{display:block}

@media(max-width:900px){
  .app{flex-direction:column}
  .mob-header{display:flex}
  .sidebar{left:-260px;transition:left 0.25s ease;z-index:25;display:flex!important;top:0}
  .sidebar.open{left:0;box-shadow:8px 0 32px rgba(0,0,0,0.35)}
  .main{margin-left:0;padding:24px}
  .stats-row{grid-template-columns:1fr 1fr}
  .charts-row{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr!important}
  .traffic-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  .main{padding:14px}
  .page-hdr{margin-bottom:18px}
  .page-hdr h1{font-size:1.35rem}
  .page-hdr p{font-size:13px}
  .stats-row{grid-template-columns:1fr 1fr!important;gap:10px;margin-bottom:16px}
  .stat-card{padding:16px 14px}
  .stat-num{font-size:1.5rem}
  .stat-lbl{font-size:10px;margin-bottom:8px}
  .stat-sub{font-size:11px}
  .charts-row{gap:12px}
  .chart-card,.form-card{padding:16px}
  .card-title{font-size:13px}
  .traffic-grid{grid-template-columns:1fr 1fr}
  .field input,.field select,.field textarea{font-size:16px}
  .login-box{padding:24px 18px}
  .login-title{font-size:1.5rem}
  .login-sub{font-size:13px}
  .btn-sm{font-size:12px;padding:10px 14px}
  td,th{padding:10px;font-size:12px}
  .table-head{padding:14px 16px}
  .schedule-list{max-height:none}
  #ex-form-row{grid-template-columns:1fr!important}
  .form-card h3{font-size:14px}
  .sched-item{gap:8px;padding:10px 12px}
  .btn{padding:13px;font-size:14px}
}
@media(max-width:380px){
  .stats-row{grid-template-columns:1fr!important}
  .main{padding:10px}
}

.mob-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.mob-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px}
.mob-card-date{font-size:12px;color:var(--primary);font-weight:700}
.mob-card-name{font-weight:700;font-size:15px;margin-bottom:2px}
.mob-card-sub{font-size:12px;color:var(--text3);margin-bottom:6px}
.mob-card-meta{font-size:12px;color:var(--text2);line-height:1.7}
.mob-card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.mob-empty{text-align:center;color:var(--text3);padding:30px;font-size:13px}
.mob-cards-wrap{padding:14px 16px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-box">
    <div class="login-logo">Ski Doc — Admin Portal</div>
    <div class="login-title">Welcome back</div>
    <p class="login-sub">Enter your password to access your dashboard.</p>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()" autocomplete="current-password"/>
    </div>
    <button class="btn" onclick="login()" id="login-btn">Access Dashboard</button>
    <div class="err" id="err">Wrong password or couldn't connect.</div>
  </div>
</div>

<div class="app" id="app">
  <div class="mob-header" id="mob-header">
    <button class="mob-btn" onclick="toggleMobileMenu()">☰</button>
    <span id="mob-page-title" style="font-size:14px;font-weight:700;flex:1">Overview</span>
  </div>
  <div class="mob-overlay" id="mob-overlay" onclick="toggleMobileMenu()"></div>

  <div class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div>
        <div class="sb-brand-name" id="sb-name">Ski Doc</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:3px">
          <div class="sb-brand-dot"></div>
          <div class="sb-brand-sub">Live</div>
        </div>
      </div>
    </div>

    <div class="sb-section">Overview</div>
    <button class="nav-item active" onclick="showPage('overview',this)"><span class="nav-item-icon">◈</span> Overview</button>
    <button class="nav-item" onclick="showPage('schedule',this)"><span class="nav-item-icon">◷</span> Schedule</button>
    <button class="nav-item" onclick="showPage('traffic',this)"><span class="nav-item-icon">↗</span> Website Traffic</button>

    <div class="sb-section">Customers</div>
    <button class="nav-item" onclick="showPage('bookings',this)"><span class="nav-item-icon">☰</span> All Bookings</button>
    <button class="nav-item" onclick="showPage('clients',this)"><span class="nav-item-icon">👤</span> Clients</button>
    <button class="nav-item" onclick="showPage('manual',this)"><span class="nav-item-icon">＋</span> Manual Entry</button>
    <button class="nav-item" onclick="showPage('availability',this)"><span class="nav-item-icon">🚫</span> Block Times</button>
    <button class="nav-item" onclick="showPage('reviews',this)"><span class="nav-item-icon">★</span> Reviews</button>
    <button class="nav-item" onclick="showPage('expenses',this)"><span class="nav-item-icon">💸</span> Expenses</button>

    <div class="sb-section">Edits</div>
    <button class="nav-item" onclick="showPage('editor',this)"><span class="nav-item-icon">✎</span> Site Editor</button>
    <button class="nav-item" onclick="showPage('ai',this)"><span class="nav-item-icon">✦</span> AI Assistant</button>

    <div class="sb-bottom">
      <button class="nav-item" onclick="showPage('danger',this)"><span class="nav-item-icon">⚠</span> Danger Zone</button>
      <button class="nav-item" onclick="logout()"><span class="nav-item-icon">⏻</span> Log Out</button>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// skidocyyc.ca/book is a proxy (not a redirect), so window.location.origin
// stays "skidocyyc.ca" even though this page is served from Render.
const API = /\bonrender\.com$/.test(location.hostname) || location.hostname === 'localhost'
  ? window.location.origin
  : 'https://skidoc-booking-eblt.onrender.com';

let pwd = '', stats = null, bookings = [], feedback = [], expenses = [];
let siteConfig = null, locationsList = [];
let currentPage = 'overview', currentPeriod = 'today', currentBookingsFilter = 'all';
let currentBlockScope = 'master'; // 'master' | 'location-a' | 'location-b' | 'mobile'
let aiHistory = [], aiPendingPatch = null;

async function login() {
  pwd = document.getElementById('pwd').value.trim();
  if (!pwd) { showErr('Enter your password.'); return; }
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Connecting...'; btn.disabled = true;
  try {
    const [sr, br, fr, er, cr, lr] = await Promise.all([
      fetch(API + '/api/stats?password=' + encodeURIComponent(pwd)),
      fetch(API + '/api/bookings?password=' + encodeURIComponent(pwd)),
      fetch(API + '/api/feedback?password=' + encodeURIComponent(pwd)),
      fetch(API + '/api/expenses?password=' + encodeURIComponent(pwd)),
      fetch(API + '/api/site-config'),
      fetch(API + '/api/locations?all=1'),
    ]);
    if (sr.status === 401) { showErr('Wrong password.'); btn.textContent = 'Access Dashboard'; btn.disabled = false; return; }
    stats = await sr.json();
    bookings = await br.json();
    feedback = await fr.json();
    expenses = await er.json();
    siteConfig = await cr.json();
    locationsList = await lr.json();

    if (siteConfig.businessName) { document.getElementById('sb-name').textContent = siteConfig.businessName; document.title = siteConfig.businessName + ' — Admin'; }

    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    renderOverview();
  } catch (e) {
    showErr('Could not connect. Try again.');
    btn.textContent = 'Access Dashboard'; btn.disabled = false;
  }
}

function showErr(msg) { const e = document.getElementById('err'); e.textContent = msg; e.style.display = 'block'; }

const PAGE_TITLES = { overview:'Overview', schedule:'Schedule', traffic:'Website Traffic', bookings:'Bookings', clients:'Clients', manual:'Manual Entry', availability:'Block Times', reviews:'Reviews', expenses:'Expenses', editor:'Site Editor', ai:'AI Assistant', danger:'Danger Zone' };

function showPage(page, el) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach((n) => n.classList.remove('active'));
  if (el) el.classList.add('active');
  const t = document.getElementById('mob-page-title');
  if (t) t.textContent = PAGE_TITLES[page] || page;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mob-overlay').classList.remove('open');
  if (page === 'overview') renderOverview();
  else if (page === 'schedule') renderSchedule();
  else if (page === 'traffic') renderTraffic();
  else if (page === 'bookings') renderBookings();
  else if (page === 'clients') renderClients();
  else if (page === 'manual') renderManualEntry();
  else if (page === 'availability') renderAvailability();
  else if (page === 'reviews') renderReviews();
  else if (page === 'expenses') renderExpenses();
  else if (page === 'editor') renderSiteEditor();
  else if (page === 'ai') renderAiAssistant();
  else if (page === 'danger') renderDanger();
}

function toggleMobileMenu() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mob-overlay').classList.toggle('open');
}

function fmt12(t) {
  if (!t || t === '00:00') return '—';
  const [h, m] = t.split(':'); const hr = parseInt(h);
  return (hr > 12 ? hr - 12 : hr || 12) + ':' + m + ' ' + (hr >= 12 ? 'PM' : 'AM');
}
function fmtDate(d) { const [y, mo, day] = d.split('-'); return MONTHS[parseInt(mo) - 1] + ' ' + parseInt(day); }
function isMobileBooking(b) { return b.location === 'mobile'; }
function addressFor(b) {
  if (isMobileBooking(b)) return b.address || '';
  const loc = locationsList.find((l) => l.id === b.location);
  return (loc && loc.address) || '';
}
function typeBadge(b) {
  const addr = addressFor(b);
  const pill = isMobileBooking(b)
    ? `<span style="background:rgba(245,158,11,0.12);color:var(--yellow);font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px">🚗 Mobile</span>`
    : `<span style="background:rgba(59,130,246,0.1);color:var(--primary);font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px">📍 ${b.locationName || 'In-Shop'}</span>`;
  return addr ? `${pill}<div style="font-size:11px;color:var(--text3);margin-top:3px">${addr}</div>` : pill;
}

// ── Overview ─────────────────────────────────────────────────
function renderOverview(period) {
  period = period || currentPeriod;
  currentPeriod = period;
  const today = new Date().toISOString().split('T')[0];
  const allConfirmed = bookings.filter((b) => b.status === 'confirmed');
  const tabStyle = (p) => `padding:8px 18px;border-radius:8px;border:1.5px solid ${period === p ? 'var(--primary)' : 'var(--border2)'};background:${period === p ? 'var(--primary-glow)' : 'transparent'};color:${period === p ? 'var(--primary)' : 'var(--text2)'};font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s`;
  const tabs = `<div style="display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap">
    <button style="${tabStyle('today')}" onclick="renderOverview('today')">Today</button>
    <button style="${tabStyle('week')}" onclick="renderOverview('week')">This Week</button>
    <button style="${tabStyle('30days')}" onclick="renderOverview('30days')">Past 30 Days</button>
    <button style="${tabStyle('alltime')}" onclick="renderOverview('alltime')">All Time</button>
  </div>`;

  if (period === 'today') {
    const todayBks = allConfirmed.filter((b) => b.date === today).sort((a, b) => a.time.localeCompare(b.time));
    const revenue = todayBks.reduce((s, b) => s + b.servicePrice, 0);
    const mobileC = todayBks.filter(isMobileBooking).length;
    const dateStr = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    document.getElementById('main').innerHTML = `
      <div class="page-hdr"><h1>Overview</h1><p>${dateStr}</p></div>
      ${tabs}

// ── Schedule ─────────────────────────────────────────────────
function renderSchedule() {
  const today = new Date().toISOString().split('T')[0];
  const confirmed = bookings.filter((b) => b.status === 'confirmed');
  const upcoming = confirmed.filter((b) => b.date >= today).sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
  const past = confirmed.filter((b) => b.date < today).sort((a, b) => b.date.localeCompare(a.date) || b.time.localeCompare(a.time));
  const mob = window.innerWidth < 640;

  const upcomingContent = mob
    ? `<div class="mob-cards-wrap">${upcoming.length ? upcoming.map((b) => `<div class="mob-card">
          <div class="mob-card-top"><span class="mob-card-date">${fmtDate(b.date)} · ${fmt12(b.time)}</span><span style="color:var(--green);font-weight:700;font-size:15px">$${b.servicePrice}</span></div>
          <div class="mob-card-name">${b.customerName}</div>
          <div class="mob-card-sub">${b.phone || '—'}</div>

            <button onclick="markNoShow('${b.id}')" style="padding:7px 14px;border-radius:8px;border:1.5px solid var(--red);background:var(--red-bg);color:var(--red);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer">No-Show</button>
          </div>
        </div>`).join('') : '<div class="mob-empty">No upcoming bookings</div>'}</div>`

        <tbody>${upcoming.length ? upcoming.map((b) => `<tr>
          <td style="font-weight:600;color:var(--primary)">${fmtDate(b.date)}</td>
          <td style="color:var(--text2)">${fmt12(b.time)}</td>
          <td><div style="font-weight:600">${b.customerName}</div><div style="font-size:11px;color:var(--text3)">${b.phone || ''}</div></td>
          <td style="color:var(--text2)">${b.serviceName}</td>
          <td>${typeBadge(b)}</td>

        </tr>`).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:40px">No upcoming bookings</td></tr>'}
        </tbody></table>`;

  const pastContent = mob
    ? `<div class="mob-cards-wrap">${past.slice(0, 20).length ? past.slice(0, 20).map((b) => `<div class="mob-card">
          <div class="mob-card-top"><span class="mob-card-date">${fmtDate(b.date)} · ${fmt12(b.time)}</span><span style="color:var(--green);font-weight:700">$${b.servicePrice}</span></div>
          <div class="mob-card-name" style="color:var(--text2)">${b.customerName}</div>
          <div class="mob-card-meta">${b.serviceName} · ${typeBadge(b)}</div>
        </div>`).join('') : '<div class="mob-empty">No past bookings</div>'}</div>`
    : `<table>
        <thead><tr><th>Date</th><th>Time</th><th>Customer</th><th>Service</th><th>Type</th><th>Price</th></tr></thead>
        <tbody>${past.slice(0, 20).length ? past.slice(0, 20).map((b) => `<tr>

          <td style="font-weight:600">${b.customerName}</td>

  document.getElementById('main').innerHTML = `

// ── All Bookings ─────────────────────────────────────────────
function renderBookings(filter) {
  filter = filter || currentBookingsFilter;
  currentBookingsFilter = filter;
  const online = bookings.filter((b) => b.source !== 'manual');
  const manual = bookings.filter((b) => b.source === 'manual');
  const list = filter === 'online' ? online : filter === 'manual' ? manual : bookings;
  const tabStyle = (f) => `padding:8px 18px;border-radius:8px;border:1.5px solid ${filter === f ? 'var(--primary)' : 'var(--border2)'};background:${filter === f ? 'var(--primary-glow)' : 'transparent'};color:${filter === f ? 'var(--primary)' : 'var(--text2)'};font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s`;
  const mob = window.innerWidth < 640;

  const listContent = mob
    ? `<div class="mob-cards-wrap">${list.length ? list.map((b) => {
        const statusBadge = b.status === 'noshow' ? `<span class="badge badge-noshow">No-Show</span>` : `<span class="badge badge-${b.status}">${b.status.replace(/_/g,' ')}</span>`;
        const sourceBadge = `<span class="badge ${b.source === 'manual' ? 'badge-pending' : 'badge-confirmed'}">${b.source === 'manual' ? 'Phone' : 'Online'}</span>`;
        const tipLine = b.tipAmount ? `<br><span style="color:var(--yellow);font-weight:700">+$${b.tipAmount} tip</span>` : '';
        return `<div class="mob-card">
          <div class="mob-card-top"><div style="display:flex;gap:6px;flex-wrap:wrap">${statusBadge}${sourceBadge}</div><span style="font-family:monospace;font-size:11px;color:var(--text3)">#${b.shortId || b.id.slice(-6)}</span></div>
          <div class="mob-card-name">${b.customerName}</div>
          <div class="mob-card-sub">${b.phone || '—'}</div>

            <button onclick="markNoShow('${b.id}')" style="padding:7px 14px;border-radius:8px;border:1.5px solid var(--red);background:var(--red-bg);color:var(--red);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer">No-Show</button>

            ? `<div style="display:flex;gap:6px;flex-wrap:wrap">

// ── Clients ──────────────────────────────────────────────────
function renderClients() {
  const clientMap = {};
  bookings.filter((b) => b.status === 'confirmed' || b.status === 'noshow').forEach((b) => {
    // Last 10 digits, so "+18255212075", "8255212075", and "18255212075" all group together.
    const digits = b.phone ? b.phone.replace(/\D/g, '') : '';
    const key = digits ? digits.slice(-10) : '__' + b.customerName.toLowerCase().trim();
    if (!clientMap[key]) {
      clientMap[key] = { name: b.customerName, phone: b.phone || '—', visits: 0, noshowCount: 0, totalSpent: 0, services: {}, firstVisit: b.date, lastVisit: b.date, onlineCount: 0, manualCount: 0, mobileCount: 0, inShopCount: 0, latestConfirmedId: null, latestConfirmedDate: null };
    }
    const c = clientMap[key];
    if (b.status === 'confirmed') {
      c.visits++; c.totalSpent += Number(b.servicePrice) || 0;
      c.services[b.serviceName] = (c.services[b.serviceName] || 0) + 1;
      if (b.source === 'manual') c.manualCount++; else c.onlineCount++;
      if (isMobileBooking(b)) c.mobileCount++; else c.inShopCount++;
      if (!c.latestConfirmedDate || b.date > c.latestConfirmedDate) { c.latestConfirmedDate = b.date; c.latestConfirmedId = b.id; }
    }
    if (b.status === 'noshow') c.noshowCount++;
    if (b.date < c.firstVisit) c.firstVisit = b.date;
    if (b.date > c.lastVisit) c.lastVisit = b.date;
  });

  const clients = Object.values(clientMap).sort((a, b) => (a.visits > 0) !== (b.visits > 0) ? (a.visits > 0 ? -1 : 1) : b.totalSpent - a.totalSpent);
  const mob = window.innerWidth < 640;

  document.getElementById('main').innerHTML = `
    <div class="page-hdr"><h1>Clients</h1><p>${clients.filter((c) => c.visits > 0).length} confirmed customers${clients.filter((c) => c.visits === 0 && c.noshowCount > 0).length > 0 ? ' · ' + clients.filter((c) => c.visits === 0 && c.noshowCount > 0).length + ' no-show only' : ''} · sorted by total spend</p></div>
    <div class="table-wrap">
      ${mob ? `<div class="mob-cards-wrap">${clients.length ? clients.map((c) => {
          const isNoShowOnly = c.visits === 0 && c.noshowCount > 0;
          const topService = Object.entries(c.services).sort((a, b) => b[1] - a[1])[0];
          const isRepeat = c.visits > 1;
          const sourceLabel = c.onlineCount > 0 && c.manualCount > 0 ? 'Online + Phone' : c.onlineCount > 0 ? 'Online' : 'Phone / In-Person';
          return `<div class="mob-card" style="${isNoShowOnly ? 'opacity:0.7' : ''}">
            <div class="mob-card-top">
              <div style="display:flex;align-items:center;gap:10px">
                <div style="width:36px;height:36px;border-radius:50%;background:${isNoShowOnly ? 'var(--red-bg)' : 'var(--bg4)'};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:${isNoShowOnly ? 'var(--red)' : 'var(--text)'};flex-shrink:0">${c.name[0].toUpperCase()}</div>
                <div><div style="font-weight:700;font-size:15px">${c.name}${isNoShowOnly ? ` <span style="background:rgba(239,68,68,0.12);color:var(--red);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px">NO SHOW</span>` : ''}</div><div style="font-size:12px;color:var(--text3)">${c.phone}</div></div>
              </div>
              <div style="text-align:right">
                <div style="font-weight:700;font-size:16px;color:${isNoShowOnly ? 'var(--text3)' : 'var(--green)'}">${isNoShowOnly ? '—' : '$' + c.totalSpent.toLocaleString()}</div>
                ${!isNoShowOnly ? `<div style="font-size:11px;color:var(--text3)">${c.visits} visit${c.visits !== 1 ? 's' : ''}${isRepeat ? ' · <span style="color:var(--primary)">Repeat</span>' : ''}</div>` : `<div style="font-size:11px;color:var(--red)">${c.noshowCount}× No-Show</div>`}
              </div>
            </div>
            ${!isNoShowOnly ? `<div class="mob-card-meta" style="margin-top:6px">${topService ? topService[0] + ' · ' : ''}${sourceLabel}<br>${c.mobileCount > 0 && c.inShopCount > 0 ? `📍 ${c.inShopCount}× In-Shop · 🚗 ${c.mobileCount}× Mobile` : c.mobileCount > 0 ? '🚗 Mobile' : '📍 In-Shop'} · Last: ${fmtDate(c.lastVisit)}</div>` : ''}
            <div class="mob-card-actions">
              ${c.phone !== '—' ? `<button onclick="sendWinback('${c.phone}','${c.name.replace(/'/g,"\\'")}',this)" style="padding:7px 14px;border-radius:8px;border:1.5px solid var(--primary);background:var(--primary-glow);color:var(--primary);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer">📲 Win-Back</button>` : ''}

              ${c.latestConfirmedId ? `<button onclick="markNoShow('${c.latestConfirmedId}')" style="padding:7px 14px;border-radius:8px;border:1.5px solid var(--red);background:var(--red-bg);color:var(--red);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer">No-Show</button>` : ''}
            </div>
          </div>`;
        }).join('') : '<div class="mob-empty">No clients yet</div>'}</div>`
      : `<table>
        <thead><tr><th>#</th><th>Customer</th><th>Visits</th><th>Total Spent</th><th>Booked Via</th><th>Service Type</th><th>Top Service</th><th>First Visit</th><th>Last Visit</th><th>Actions</th></tr></thead>
        <tbody>${clients.length ? clients.map((c, i) => {
          const isNoShowOnly = c.visits === 0 && c.noshowCount > 0;
          const topService = Object.entries(c.services).sort((a, b) => b[1] - a[1])[0];
          const allServices = Object.entries(c.services).map(([s, n]) => n > 1 ? `${s} ×${n}` : s).join(', ');
          const isRepeat = c.visits > 1;
          const sourceLabel = c.onlineCount > 0 && c.manualCount > 0 ? 'Online + Phone' : c.onlineCount > 0 ? 'Online' : 'Phone / In-Person';
          const sourceBadgeColor = c.onlineCount > 0 && c.manualCount === 0 ? 'var(--primary)' : c.manualCount > 0 && c.onlineCount === 0 ? 'var(--yellow)' : 'var(--green)';
          const sourceBgColor = c.onlineCount > 0 && c.manualCount === 0 ? 'var(--primary-glow)' : c.manualCount > 0 && c.onlineCount === 0 ? 'var(--yellow-bg)' : 'var(--green-bg)';
          const typeCell = c.mobileCount > 0 && c.inShopCount > 0
            ? `<div style="display:flex;flex-direction:column;gap:3px"><span style="background:rgba(59,130,246,0.1);color:var(--primary);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px">📍 ${c.inShopCount}× In-Shop</span><span style="background:rgba(245,158,11,0.12);color:var(--yellow);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px">🚗 ${c.mobileCount}× Mobile</span></div>`
            : c.mobileCount > 0 ? `<span style="background:rgba(245,158,11,0.12);color:var(--yellow);font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px">🚗 Mobile</span>`
            : `<span style="background:rgba(59,130,246,0.1);color:var(--primary);font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px">📍 In-Shop</span>`;
          return `<tr style="${isNoShowOnly ? 'opacity:0.65' : ''}">
            <td style="color:var(--text3);font-size:12px">${i + 1}</td>
            <td><div style="display:flex;align-items:center;gap:10px"><div style="width:34px;height:34px;border-radius:50%;background:${isNoShowOnly ? 'var(--red-bg)' : 'var(--bg4)'};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:${isNoShowOnly ? 'var(--red)' : 'var(--text)'};flex-shrink:0">${c.name[0].toUpperCase()}</div><div><div style="font-weight:600;display:flex;align-items:center;gap:6px">${c.name}${isNoShowOnly ? ` <span style="background:rgba(239,68,68,0.12);color:var(--red);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px">NO SHOW</span>` : ''}</div><div style="font-size:11px;color:var(--text3)">${c.phone}</div></div></div></td>

            <td style="font-weight:700;color:${isNoShowOnly ? 'var(--text3)' : 'var(--green)'};font-size:15px">${isNoShowOnly ? '—' : '$' + c.totalSpent.toLocaleString()}</td>
            <td>${isNoShowOnly ? '—' : `<span style="background:${sourceBgColor};color:${sourceBadgeColor};font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;letter-spacing:0.04em">${sourceLabel}</span>`}</td>
            <td>${isNoShowOnly ? '—' : typeCell}</td>
            <td><div style="font-size:13px;color:var(--text2)">${topService ? topService[0] : '—'}</div>${Object.keys(c.services).length > 1 ? `<div style="font-size:11px;color:var(--text3);margin-top:2px">${allServices}</div>` : ''}</td>
            <td style="color:var(--text3);font-size:12px">${fmtDate(c.firstVisit)}</td>

              ${c.phone !== '—' ? `<button onclick="sendWinback('${c.phone}','${c.name.replace(/'/g,"\\'")}',this)" style="padding:5px 11px;border-radius:7px;border:1.5px solid var(--primary);background:var(--primary-glow);color:var(--primary);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap">📲 Win-Back</button>` : ''}
              ${c.phone !== '—' ? `<button onclick="sendReview('${c.phone}','${c.name.replace(/'/g,"\\'")}',this)" style="padding:5px 11px;border-radius:7px;border:1.5px solid var(--yellow);background:var(--yellow-bg);color:var(--yellow);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap">⭐ Review</button>` : ''}

function toggleManualAddress() {
  document.getElementById('me-address-wrap').style.display = document.getElementById('me-type').value === 'mobile' ? 'block' : 'none';
}

async function addManualEntry() {
  const name = document.getElementById('me-name').value.trim();
  const phone = document.getElementById('me-phone').value.trim();
  const service = document.getElementById('me-service').value.trim();
  const price = document.getElementById('me-price').value.trim();
  const date = document.getElementById('me-date').value;
  const notes = document.getElementById('me-notes').value.trim();
  const delay = parseInt(document.getElementById('me-delay').value);
  const serviceType = document.getElementById('me-type').value;
  const address = document.getElementById('me-address').value.trim();
  const msg = document.getElementById('me-msg');
  if (!name || !service) { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = 'Name and service are required.'; return; }
  if (serviceType === 'mobile' && !address) { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = 'Address is required for mobile.'; return; }
  const btn = document.querySelector('[onclick="addManualEntry()"]');
  btn.textContent = 'Logging...'; btn.disabled = true;
  try {
    const r = await fetch(API + '/api/manual-entry?password=' + encodeURIComponent(pwd), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customerName: name, phone, serviceName: service, servicePrice: price, date, notes, reviewDelayMinutes: delay, serviceType, address: serviceType === 'mobile' ? address : null }),
    });
    const d = await r.json();
    if (d.success) {
      msg.className = 'form-msg ok'; msg.style.display = 'block';
      const smsNote = !phone ? 'No phone — SMS skipped.' : delay === -1 ? 'No review SMS will be sent.' : delay === 0 ? 'Review SMS sent immediately.' : `Review SMS scheduled in ${delay / 60} hour${delay / 60 > 1 ? 's' : ''}.`;
      msg.textContent = '✓ Logged! ' + smsNote;
      ['me-name','me-phone','me-service','me-price','me-notes','me-address'].forEach((id) => { document.getElementById(id).value = ''; });
      document.getElementById('me-type').value = 'inshop';
      document.getElementById('me-address-wrap').style.display = 'none';
      bookings = await (await fetch(API + '/api/bookings?password=' + encodeURIComponent(pwd))).json();
      stats = await (await fetch(API + '/api/stats?password=' + encodeURIComponent(pwd))).json();
      renderManualEntry();
    } else { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = d.error || 'Error.'; }
  } catch (e) { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = 'Connection error.'; }
  const btn2 = document.querySelector('[onclick="addManualEntry()"]');
  if (btn2) { btn2.textContent = 'Log Booking'; btn2.disabled = false; }
}

async function markNoShow(id) {
  if (!confirm('Mark this booking as a no-show? The review SMS will not be sent.')) return;
  const r = await fetch(API + '/api/bookings/' + id + '/noshow?password=' + encodeURIComponent(pwd), { method: 'POST' });
  const d = await r.json();
  if (d.success) { bookings = await (await fetch(API + '/api/bookings?password=' + encodeURIComponent(pwd))).json(); showPage(currentPage); }
  else { alert('Failed to mark as no-show.'); }
}

async function sendWinback(phone, name, btn) {
  btn.textContent = 'Sending…'; btn.disabled = true;
  const r = await fetch(API + '/api/winback?password=' + encodeURIComponent(pwd), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, customerName: name }) });

async function addTip(id, btn) {
  const raw = prompt('Enter tip amount ($):');
  if (raw === null) return;
  const amount = parseFloat(raw);
  if (!amount || amount <= 0 || isNaN(amount)) { alert('Enter a valid amount.'); return; }
  btn.textContent = 'Saving…'; btn.disabled = true;
  try {
    const r = await fetch(API + '/api/bookings/' + id + '/tip?password=' + encodeURIComponent(pwd), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount }) });
    const d = await r.json();
    if (d.success) {
      bookings = await (await fetch(API + '/api/bookings?password=' + encodeURIComponent(pwd))).json();
      stats = await (await fetch(API + '/api/stats?password=' + encodeURIComponent(pwd))).json();
      renderBookings();
    } else { alert('Failed to save tip.'); btn.textContent = 'Add Tip'; btn.disabled = false; }
  } catch (e) { alert('Connection error.'); btn.textContent = 'Add Tip'; btn.disabled = false; }
}

// ── Block Times ──────────────────────────────────────────────
function blockScopeName(scope) {
  if (scope === 'master') return 'All Locations';
  if (scope === 'mobile') return 'Mobile';
  const loc = locationsList.find((l) => l.id === scope);
  return loc ? loc.name : scope;
}
function blockScopeParam() { return currentBlockScope === 'master' ? null : currentBlockScope; }

function renderAvailability(scope) {
  if (scope) currentBlockScope = scope;
  const today = new Date().toISOString().split('T')[0];
  const tabStyle = (s) => `padding:8px 18px;border-radius:8px;border:1.5px solid ${currentBlockScope === s ? 'var(--primary)' : 'var(--border2)'};background:${currentBlockScope === s ? 'var(--primary-glow)' : 'transparent'};color:${currentBlockScope === s ? 'var(--primary)' : 'var(--text2)'};font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s`;
  const isMaster = currentBlockScope === 'master';
  const tabs = `<div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap">
    <button style="${tabStyle('master')}" onclick="renderAvailability('master')">⬡ All Locations (Master)</button>
    <button style="${tabStyle('location-a')}" onclick="renderAvailability('location-a')">📍 ${blockScopeName('location-a')}</button>
    <button style="${tabStyle('location-b')}" onclick="renderAvailability('location-b')">📍 ${blockScopeName('location-b')}</button>
    <button style="${tabStyle('mobile')}" onclick="renderAvailability('mobile')">🚐 Mobile</button>

    ${tabs}
    <div class="form-card" style="margin-bottom:20px">
      <h3 style="margin-bottom:4px">Block a single day</h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:16px">No one will be able to book any slots on that date${isMaster ? ', anywhere' : ` at ${blockScopeName(currentBlockScope)}`}.</p>
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <div class="field" style="margin:0;flex:1;min-width:180px"><label>Date</label><input type="date" id="single-day-date" min="${today}"/></div>
        <button class="btn-sm" onclick="blockSingleDay()" style="height:44px">Block Day</button>
      </div>
      <div class="form-msg" id="single-day-msg"></div>
    </div>
    <div class="form-card" style="margin-bottom:20px">
      <h3 style="margin-bottom:4px">Block a range of days</h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:16px">e.g. a vacation or holiday week.</p>
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <div class="field" style="margin:0;flex:1;min-width:140px"><label>From</label><input type="date" id="days-range-start" min="${today}"/></div>
        <div class="field" style="margin:0;flex:1;min-width:140px"><label>To</label><input type="date" id="days-range-end" min="${today}"/></div>
        <button class="btn-sm" onclick="blockDaysRange()" style="height:44px">Block Days</button>
      </div>
      <div class="form-msg" id="days-range-msg"></div>
    </div>
    <div class="form-card" style="margin-bottom:20px">
      <h3 style="margin-bottom:4px">Block a time range</h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:16px">e.g. 3:00 PM to 7:00 PM on a single day.</p>
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <div class="field" style="margin:0;flex:1;min-width:140px"><label>Date</label><input type="date" id="range-date" min="${today}"/></div>
        <div class="field" style="margin:0;min-width:110px"><label>From</label><input type="time" id="range-start" step="1800"/></div>
        <div class="field" style="margin:0;min-width:110px"><label>To</label><input type="time" id="range-end" step="1800"/></div>
        <button class="btn-sm" onclick="blockRange()" style="height:44px">Block Range</button>
      </div>
      <div class="form-msg" id="range-msg"></div>
    </div>
    ${isMaster ? '' : `
    <div class="form-card" style="margin-bottom:20px">
      <h3 style="margin-bottom:16px">Manage individual slots — ${blockScopeName(currentBlockScope)}</h3>
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <div class="field" style="margin:0;flex:1;min-width:180px"><label>Date</label><input type="date" id="block-date" min="${today}"/></div>

      </div>

async function blockSingleDay() {
  const date = document.getElementById('single-day-date').value;
  const msg = document.getElementById('single-day-msg');
  if (!date) { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = 'Pick a date first.'; return; }
  const r = await fetch(API + '/api/blocked?password=' + encodeURIComponent(pwd), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date, location: blockScopeParam() }) });
  const d = await r.json();
  if (d.success) { msg.className = 'form-msg ok'; msg.style.display = 'block'; msg.textContent = `✓ ${new Date(date + 'T12:00:00').toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' })} is now blocked for ${blockScopeName(currentBlockScope)}.`; document.getElementById('single-day-date').value = ''; }
  else { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = 'Error — try again.'; }
}

async function blockDaysRange() {
  const start = document.getElementById('days-range-start').value;
  const end = document.getElementById('days-range-end').value;
  const msg = document.getElementById('days-range-msg');
  if (!start || !end) { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = 'Pick both dates.'; return; }
  if (start > end) { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = '"From" must be before or same as "To".'; return; }
  const dates = []; const cur = new Date(start + 'T12:00:00'); const last = new Date(end + 'T12:00:00');
  while (cur <= last) { dates.push(cur.toISOString().split('T')[0]); cur.setDate(cur.getDate() + 1); }
  msg.className = 'form-msg ok'; msg.style.display = 'block'; msg.textContent = `Blocking ${dates.length} day(s)...`;
  let ok = 0;
  for (const date of dates) { try { await fetch(API + '/api/blocked?password=' + encodeURIComponent(pwd), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date, location: blockScopeParam() }) }); ok++; } catch (e) {} }
  msg.textContent = `✓ Blocked ${ok} day(s) for ${blockScopeName(currentBlockScope)}: ${new Date(start + 'T12:00:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric' })} – ${new Date(end + 'T12:00:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric' })}.`;
  document.getElementById('days-range-start').value = ''; document.getElementById('days-range-end').value = '';
}

async function blockRange() {
  const date = document.getElementById('range-date').value;
  const start = document.getElementById('range-start').value;
  const end = document.getElementById('range-end').value;
  const msg = document.getElementById('range-msg');
  if (!date || !start || !end) { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = 'Fill in all three fields.'; return; }
  if (start >= end) { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = '"From" must be before "To".'; return; }
  const r = await fetch(API + '/api/blocked/range?password=' + encodeURIComponent(pwd), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date, startTime: start, endTime: end, location: blockScopeParam() }) });
  const d = await r.json();
  if (d.success) { msg.className = 'form-msg ok'; msg.style.display = 'block'; msg.textContent = `✓ Blocked ${blockScopeName(currentBlockScope)} from ${formatTime12(start)} to ${formatTime12(end)} on ${new Date(date + 'T12:00:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric' })}.`; document.getElementById('range-date').value = ''; document.getElementById('range-start').value = ''; document.getElementById('range-end').value = ''; }
  else { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = 'Error — try again.'; }
}

async function loadBlockDate() {
  const date = document.getElementById('block-date').value;
  const location = currentBlockScope;
  if (!date) return;
  const area = document.getElementById('block-slots-area');
  area.innerHTML = `<div style="color:var(--text3);padding:20px">Loading...</div>`;
  const [slotsRes, blockedRes] = await Promise.all([
    fetch(API + '/api/availability?date=' + date + '&location=' + encodeURIComponent(location)),
    fetch(API + '/api/blocked?password=' + encodeURIComponent(pwd)),
  ]);
  const slotsData = await slotsRes.json();
  const blockedAll = await blockedRes.json();
  const loc = blockScopeParam();
  const dayBlocked = blockedAll.some((b) => b.date === date && !b.time && ((b.location || null) === null || (b.location || null) === loc));
  const allSlots = slotsData.slots || [];
  area.innerHTML = `
    <div class="form-card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px">
        <div><div style="font-weight:700;font-size:15px">${new Date(date + 'T12:00:00').toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' })}</div><div style="font-size:12px;color:var(--text3);margin-top:3px">${dayBlocked ? 'Entire day is blocked' : allSlots.length + ' time slots'}</div></div>
        <button onclick="toggleDay('${date}', ${dayBlocked})" style="padding:10px 18px;border-radius:10px;border:1.5px solid ${dayBlocked ? 'var(--green)' : 'var(--red)'};background:${dayBlocked ? 'var(--green-bg)' : 'var(--red-bg)'};color:${dayBlocked ? 'var(--green)' : 'var(--red)'};font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">${dayBlocked ? '✓ Unblock Entire Day' : '✕ Block Entire Day'}</button>
      </div>
      ${dayBlocked ? `<p style="color:var(--text3);font-size:13px">Unblock the day to manage individual slots.</p>` : allSlots.length === 0 ? `<p style="color:var(--text3);font-size:13px">No available slots for this day based on your configured hours.</p>` : `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px">
        ${allSlots.map((s) => {
          const isBlocked = s.status === 'blocked';
          const isBooked = s.status === 'booked';
          return `<button onclick="${isBooked ? '' : `toggleSlot('${date}','${s.time}',${isBlocked})`}" style="padding:12px 8px;border-radius:10px;border:1.5px solid ${isBooked ? 'var(--border)' : isBlocked ? 'var(--red)' : 'var(--green)'};background:${isBooked ? 'var(--bg3)' : isBlocked ? 'var(--red-bg)' : 'var(--green-bg)'};color:${isBooked ? 'var(--text3)' : isBlocked ? 'var(--red)' : 'var(--green)'};font-family:inherit;font-size:13px;font-weight:600;cursor:${isBooked ? 'default' : 'pointer'};text-align:center"><div>${formatTime12(s.time)}</div><div style="font-size:10px;margin-top:3px;text-transform:uppercase;letter-spacing:0.05em">${isBooked ? 'Booked' : isBlocked ? 'Blocked' : 'Open'}</div></button>`;
        }).join('')}
      </div>`}
    </div>`;
}

function formatTime12(t) { const [h, m] = t.split(':'); const hr = parseInt(h); return `${hr > 12 ? hr - 12 : hr || 12}:${m} ${hr >= 12 ? 'PM' : 'AM'}`; }

async function toggleDay(date, isBlocked) {
  await fetch(API + '/api/blocked?password=' + encodeURIComponent(pwd), { method: isBlocked ? 'DELETE' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date, location: blockScopeParam() }) });
  loadBlockDate();
}
async function toggleSlot(date, time, isBlocked) {
  await fetch(API + '/api/blocked?password=' + encodeURIComponent(pwd), { method: isBlocked ? 'DELETE' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date, time, location: blockScopeParam() }) });
  loadBlockDate();
}

async function addExpense() {
  const desc = document.getElementById('ex-desc').value.trim();
  const cat = document.getElementById('ex-cat').value;
  const amount = document.getElementById('ex-amount').value;
  const date = document.getElementById('ex-date').value;
  const msg = document.getElementById('ex-msg');
  if (!desc || !amount) { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = 'Description and amount required.'; return; }
  const btn = document.querySelector('[onclick="addExpense()"]');
  btn.textContent = 'Adding…'; btn.disabled = true;
  try {
    const r = await fetch(API + '/api/expenses?password=' + encodeURIComponent(pwd), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ description: desc, category: cat, amount, date }) });
    const d = await r.json();
    if (d.success) {
      expenses = await (await fetch(API + '/api/expenses?password=' + encodeURIComponent(pwd))).json();
      stats = await (await fetch(API + '/api/stats?password=' + encodeURIComponent(pwd))).json();
      renderExpenses();
    } else { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = 'Error saving expense.'; btn.textContent = 'Add'; btn.disabled = false; }
  } catch (e) { msg.className = 'form-msg fail'; msg.style.display = 'block'; msg.textContent = 'Connection error. Try again.'; btn.textContent = 'Add'; btn.disabled = false; }
}

async function deleteExpense(id) {
  if (!confirm('Delete this expense?')) return;
  await fetch(API + '/api/expenses/' + id + '?password=' + encodeURIComponent(pwd), { method: 'DELETE' });
  expenses = await (await fetch(API + '/api/expenses?password=' + encodeURIComponent(pwd))).json();
  stats = await (await fetch(API + '/api/stats?password=' + encodeURIComponent(pwd))).json();
  renderExpenses();
}

// ── Site Editor (CMS) ────────────────────────────────────────
function cmsMsg(id, ok, text) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'form-msg ' + (ok ? 'ok' : 'fail');
  el.textContent = text;
  el.style.display = 'block';
}

async function putSiteConfig(patch) {
  const r = await fetch(API + '/api/site-config?password=' + encodeURIComponent(pwd), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch),
  });
  const d = await r.json();
  if (d.success) siteConfig = d.siteConfig;
  return d;
}

function renderSiteEditor() {
  const c = siteConfig || {};
  const mobileOn = c.mobileEnabled !== false;
  const svc = c.services || [];
  const locs = c.locations || [];

  document.getElementById('main').innerHTML = `
    <div class="page-hdr"><h1>Site Editor</h1><p>Edit what shows on your website and booking page — no code required.</p></div>

    <div class="form-card" style="border-color:${mobileOn ? 'var(--border)' : 'var(--red)'}">
      <h3>Mobile Service — On / Off Switch</h3>
      <p>Turning this off immediately hides mobile everywhere: the "We Come To You" banner on your homepage, the Mobile page, the mobile pricing toggle, and the mobile option on your booking page. Turn it back on any time — nothing is deleted.</p>
      <div style="display:flex;align-items:center;gap:16px">
        <span class="badge ${mobileOn ? 'badge-confirmed' : 'badge-denied'}" style="font-size:12px;padding:6px 14px">${mobileOn ? 'MOBILE IS ON' : 'MOBILE IS OFF'}</span>
        <button class="btn-sm" style="${mobileOn ? 'background:var(--red)' : ''}" onclick="toggleMobileService()">${mobileOn ? 'Turn Mobile Off' : 'Turn Mobile Back On'}</button>
      </div>
      <div class="form-msg" id="mobile-toggle-msg"></div>
    </div>

    <div class="form-card">
      <h3>Locations</h3>
      <p>Names and addresses for your in-shop locations — also shown to customers on the booking page. Removing one hides it from booking immediately, but nothing is deleted — bring it back any time.</p>
      ${locs.map((l, i) => {
        const locOn = l.enabled !== false;
        return `<div style="padding:14px;border:1.5px solid var(--border2);border-radius:10px;margin-bottom:${i < locs.length - 1 ? '14px' : '0'}">
        <div class="form-row" style="grid-template-columns:1fr 2fr">
          <div class="field"><label>Name</label><input type="text" id="cms-loc-name-${i}" value="${l.name || ''}" ${!locOn ? 'disabled' : ''}/></div>
          <div class="field"><label>Address</label><input type="text" id="cms-loc-addr-${i}" value="${l.address || ''}" ${!locOn ? 'disabled' : ''}/></div>
        </div>
        <div style="margin-top:12px;display:flex;align-items:center;gap:10px">
          <span class="badge ${locOn ? 'badge-confirmed' : 'badge-denied'}" style="font-size:11px">${locOn ? 'ACTIVE' : 'REMOVED'}</span>
          <button class="btn-sm" style="background:${locOn ? 'var(--red)' : 'var(--green)'}" onclick="toggleLocation(${i})">${locOn ? 'Remove' : 'Bring Back'}</button>
        </div>
      </div>`;
      }).join('')}
      <div style="margin-top:16px"><button class="btn-sm" onclick="saveLocations()">Save</button></div>
      <div class="form-msg" id="locations-msg"></div>
    </div>

    <div class="form-card">
      <h3>Business Info</h3>
      <p>Feeds your SMS messages and website footer.</p>
      <div class="form-row" style="grid-template-columns:1fr 1fr 1fr">
        <div class="field"><label>Business Name</label><input type="text" id="cms-name" value="${c.businessName || ''}"/></div>
        <div class="field"><label>Phone</label><input type="text" id="cms-phone" value="${c.phone || ''}"/></div>
        <div class="field"><label>Email</label><input type="text" id="cms-email" value="${c.email || ''}"/></div>
      </div>
      <div style="margin-top:16px"><button class="btn-sm" onclick="saveBusinessInfo()">Save</button></div>
      <div class="form-msg" id="business-msg"></div>
    </div>

    <div class="form-card">
      <h3>Socials</h3>
      <div class="form-row" style="grid-template-columns:1fr 1fr 1fr">
        <div class="field"><label>Instagram URL</label><input type="text" id="cms-ig" value="${(c.socials && c.socials.instagram) || ''}"/></div>
        <div class="field"><label>Facebook URL</label><input type="text" id="cms-fb" value="${(c.socials && c.socials.facebook) || ''}"/></div>
        <div class="field"><label>Google URL</label><input type="text" id="cms-gg" value="${(c.socials && c.socials.google) || ''}"/></div>
      </div>
      <div style="margin-top:16px"><button class="btn-sm" onclick="saveSocials()">Save</button></div>
      <div class="form-msg" id="socials-msg"></div>
    </div>

    <div class="form-card">
      <h3>Homepage Hero</h3>
      <div class="field" style="margin-bottom:14px"><label>Headline</label><input type="text" id="cms-hero-h" value="${(c.hero && c.hero.headline) || ''}"/></div>
      <div class="field"><label>Subtitle</label><input type="text" id="cms-hero-s" value="${(c.hero && c.hero.subtitle) || ''}"/></div>
      <div style="margin-top:16px"><button class="btn-sm" onclick="saveHero()">Save</button></div>
      <div class="form-msg" id="hero-msg"></div>
    </div>

    <div class="form-card">
      <h3>Mobile Page</h3>
      <div class="field" style="margin-bottom:14px"><label>Headline</label><input type="text" id="cms-mp-h" value="${(c.mobilePage && c.mobilePage.headline) || ''}"/></div>
      <div class="field"><label>Description</label><input type="text" id="cms-mp-d" value="${(c.mobilePage && c.mobilePage.description) || ''}"/></div>
      <div style="margin-top:16px"><button class="btn-sm" onclick="saveMobilePage()">Save</button></div>
      <div class="form-msg" id="mp-msg"></div>
    </div>

    <div class="form-card">
      <h3>Kids' Discount Banner</h3>
      <p>The callout shown above your pricing table.</p>
      <div class="field"><label>Text</label><input type="text" id="cms-kids" value="${c.kidsDiscountText || ''}"/></div>
      <div style="margin-top:16px"><button class="btn-sm" onclick="saveKidsBanner()">Save</button></div>
      <div class="form-msg" id="kids-msg"></div>
    </div>

    <div class="form-card">
      <h3>Services &amp; Pricing</h3>
      <p>Edit names, prices, and descriptions. Prices shown are in-shop — mobile adds the surcharge automatically.</p>
      <div id="cms-services-list">${svc.map((s, i) => cmsServiceRow(s, i)).join('')}</div>
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-sm" style="background:var(--green)" onclick="addServiceRow()">+ Add Service</button>
        <button class="btn-sm" onclick="saveServices()">Save All Services</button>
      </div>
      <div class="form-msg" id="services-msg"></div>
    </div>`;
}

function cmsServiceRow(s, i) {
  return `<div class="form-card" style="background:var(--bg3);margin-bottom:12px" id="cms-svc-${i}">
    <div class="form-row" style="grid-template-columns:2fr 1fr 1fr auto">
      <div class="field"><label>Name</label><input type="text" id="cms-svc-name-${i}" value="${s.name || ''}"/></div>
      <div class="field"><label>Price ($)</label><input type="number" id="cms-svc-price-${i}" value="${s.price || 0}"/></div>
      <div class="field"><label>Category</label><select id="cms-svc-cat-${i}"><option value="package" ${s.category === 'package' ? 'selected' : ''}>Package</option><option value="single" ${s.category !== 'package' ? 'selected' : ''}>Individual</option></select></div>
      <button class="btn-sm" style="background:var(--red);margin-top:20px" onclick="removeServiceRow(${i})">Remove</button>
    </div>
    <div class="field" style="margin-top:12px"><label>Description</label><input type="text" id="cms-svc-desc-${i}" value="${(s.description || '').replace(/"/g, '&quot;')}"/></div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--text2)"><input type="checkbox" id="cms-svc-from-${i}" ${s.fromPrice ? 'checked' : ''}/> Show "from" before the price</label>
  </div>`;
}

let cmsServicesDraft = null;
function addServiceRow() {
  cmsServicesDraft = readServicesDraft();
  cmsServicesDraft.push({ id: 'service-' + Date.now(), name: 'New Service', price: 0, category: 'single', description: '' });
  document.getElementById('cms-services-list').innerHTML = cmsServicesDraft.map(cmsServiceRow).join('');
}
function removeServiceRow(i) {
  cmsServicesDraft = readServicesDraft();
  cmsServicesDraft.splice(i, 1);
  document.getElementById('cms-services-list').innerHTML = cmsServicesDraft.map(cmsServiceRow).join('');
}
function readServicesDraft() {
  const svc = (cmsServicesDraft || siteConfig.services);
  return svc.map((s, i) => {
    const nameEl = document.getElementById('cms-svc-name-' + i);
    if (!nameEl) return s; // row was just added/removed and not yet re-read
    return {
      id: s.id,
      name: nameEl.value.trim(),
      price: Number(document.getElementById('cms-svc-price-' + i).value) || 0,
      category: document.getElementById('cms-svc-cat-' + i).value,
      description: document.getElementById('cms-svc-desc-' + i).value.trim(),
      fromPrice: document.getElementById('cms-svc-from-' + i).checked,
    };
  });
}

async function saveBusinessInfo() {
  const d = await putSiteConfig({ businessName: document.getElementById('cms-name').value.trim(), phone: document.getElementById('cms-phone').value.trim(), email: document.getElementById('cms-email').value.trim() });
  cmsMsg('business-msg', d.success, d.success ? '✓ Saved.' : (d.error || 'Failed.'));
  if (d.success && siteConfig.businessName) { document.getElementById('sb-name').textContent = siteConfig.businessName; document.title = siteConfig.businessName + ' — Admin'; }
}
async function saveSocials() {
  const d = await putSiteConfig({ socials: { instagram: document.getElementById('cms-ig').value.trim(), facebook: document.getElementById('cms-fb').value.trim(), google: document.getElementById('cms-gg').value.trim() } });
  cmsMsg('socials-msg', d.success, d.success ? '✓ Saved.' : (d.error || 'Failed.'));
}
async function saveHero() {
  const d = await putSiteConfig({ hero: { headline: document.getElementById('cms-hero-h').value.trim(), subtitle: document.getElementById('cms-hero-s').value.trim() } });
  cmsMsg('hero-msg', d.success, d.success ? '✓ Saved. Live on your homepage within a moment.' : (d.error || 'Failed.'));
}
async function saveMobilePage() {
  const d = await putSiteConfig({ mobilePage: { headline: document.getElementById('cms-mp-h').value.trim(), description: document.getElementById('cms-mp-d').value.trim() } });
  cmsMsg('mp-msg', d.success, d.success ? '✓ Saved.' : (d.error || 'Failed.'));
}
async function saveKidsBanner() {
  const d = await putSiteConfig({ kidsDiscountText: document.getElementById('cms-kids').value.trim() });
  cmsMsg('kids-msg', d.success, d.success ? '✓ Saved.' : (d.error || 'Failed.'));
}
async function saveLocations() {
  const locs = (siteConfig.locations || []).map((l, i) => ({ id: l.id, name: document.getElementById('cms-loc-name-' + i).value.trim(), address: document.getElementById('cms-loc-addr-' + i).value.trim(), enabled: l.enabled !== false }));
  const d = await putSiteConfig({ locations: locs });
  if (d.success) locationsList = locs;
  cmsMsg('locations-msg', d.success, d.success ? '✓ Saved.' : (d.error || 'Failed.'));
}
async function toggleLocation(i) {
  const locs = siteConfig.locations || [];
  const target = locs[i];
  const next = !(target.enabled !== false);
  if (!next && !confirm(`Remove "${target.name}" from the booking page? It disappears from booking immediately, but nothing is deleted — you can bring it back any time.`)) return;
  const updated = locs.map((l, j) => j === i ? { ...l, enabled: next } : l);
  const d = await putSiteConfig({ locations: updated });
  if (d.success) locationsList = updated;
  cmsMsg('locations-msg', d.success, d.success ? (next ? '✓ Brought back.' : '✓ Removed from booking.') : (d.error || 'Failed.'));
  if (d.success) renderSiteEditor();
}
async function saveServices() {
  const services = readServicesDraft();
  if (services.some((s) => !s.name)) { cmsMsg('services-msg', false, 'Every service needs a name.'); return; }
  const d = await putSiteConfig({ services });
  cmsServicesDraft = null;
  cmsMsg('services-msg', d.success, d.success ? '✓ Saved — live on your booking page and services page.' : (d.error || 'Failed.'));
}
async function toggleMobileService() {
  const next = !(siteConfig.mobileEnabled !== false);
  if (!next && !confirm('Turn mobile service off? It disappears from your website and booking page immediately, but nothing is deleted — you can turn it back on any time.')) return;
  const d = await putSiteConfig({ mobileEnabled: next });
  cmsMsg('mobile-toggle-msg', d.success, d.success ? (next ? '✓ Mobile is back on.' : '✓ Mobile is now off everywhere.') : (d.error || 'Failed.'));
  if (d.success) renderSiteEditor();
}

// ── AI Assistant (scoped to Site Editor content only) ───────────
function renderAiAssistant() {
  document.getElementById('main').innerHTML = `
    <div class="page-hdr"><h1>AI Assistant</h1><p>Describe a change in plain English — it can only edit things in the Site Editor (prices, text, business info, mobile on/off). It always shows you the change before applying it.</p></div>
    <div class="chart-card" style="margin-bottom:20px">
      <div id="ai-thread" style="display:flex;flex-direction:column;gap:14px;margin-bottom:20px;max-height:420px;overflow-y:auto">${aiHistory.length ? aiHistory.map(aiBubble).join('') : '<div style="color:var(--text3);font-size:13px">Try: "raise the seasonal tune price by $5" or "turn off mobile service".</div>'}</div>
      <div id="ai-pending"></div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <input type="text" id="ai-input" placeholder="What would you like to change?" style="flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:12px 15px;font-family:'Outfit',sans-serif;font-size:14px;color:var(--text);outline:none" onkeydown="if(event.key==='Enter')sendAiMessage()"/>
        <button class="btn-sm" id="ai-send-btn" onclick="sendAiMessage()">Send</button>
      </div>
    </div>`;
  renderAiPending();
}

function aiBubble(m) {
  if (m.role === 'user') return `<div style="align-self:flex-end;max-width:80%;background:var(--primary);color:#fff;padding:10px 16px;border-radius:14px 14px 4px 14px;font-size:13px">${m.text}</div>`;
  return `<div style="align-self:flex-start;max-width:80%;background:var(--bg3);border:1px solid var(--border);padding:10px 16px;border-radius:14px 14px 14px 4px;font-size:13px;color:var(--text2)">${m.text}</div>`;
}

function renderAiPending() {
  const area = document.getElementById('ai-pending');
  if (!area) return;
  if (!aiPendingPatch || !Object.keys(aiPendingPatch).length) { area.innerHTML = ''; return; }
  area.innerHTML = `<div class="form-card" style="border-color:var(--primary);margin-bottom:0">
    <h3 style="margin-bottom:12px">Proposed change</h3>
    <pre style="background:var(--bg);border-radius:10px;padding:14px;font-size:12px;color:var(--text2);overflow-x:auto;white-space:pre-wrap">${JSON.stringify(aiPendingPatch, null, 2)}</pre>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn-sm" style="background:var(--green)" onclick="applyAiPatch()">Apply Change</button>
      <button class="btn-sm" style="background:var(--red)" onclick="discardAiPatch()">Discard</button>
    </div>
  </div>`;
}

async function sendAiMessage() {
  const input = document.getElementById('ai-input');
  const message = input.value.trim();
  if (!message) return;
  aiHistory.push({ role: 'user', text: message });
  input.value = '';
  const btn = document.getElementById('ai-send-btn');
  btn.textContent = 'Thinking…'; btn.disabled = true;
  renderAiAssistant();
  try {
    const r = await fetch(API + '/api/ai-assist?password=' + encodeURIComponent(pwd), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }),
    });
    const d = await r.json();
    if (!r.ok) { aiHistory.push({ role: 'assistant', text: d.error || 'Something went wrong.' }); aiPendingPatch = null; }
    else { aiHistory.push({ role: 'assistant', text: d.explanation || 'Done.' }); aiPendingPatch = (d.patch && Object.keys(d.patch).length) ? d.patch : null; }
  } catch (e) {
    aiHistory.push({ role: 'assistant', text: 'Connection error — try again.' });
    aiPendingPatch = null;
  }
  renderAiAssistant();
}

async function applyAiPatch() {
  if (!aiPendingPatch) return;
  const d = await putSiteConfig(aiPendingPatch);
  aiHistory.push({ role: 'assistant', text: d.success ? '✓ Applied.' : (d.error || 'Failed to apply.') });
  aiPendingPatch = null;
  if (d.success && siteConfig.locations) locationsList = siteConfig.locations;
  renderAiAssistant();
}
function discardAiPatch() {
  aiPendingPatch = null;
  aiHistory.push({ role: 'assistant', text: 'Okay, discarded.' });
  renderAiAssistant();
}

// ── Danger Zone ──────────────────────────────────────────────
function renderDanger() {
  document.getElementById('main').innerHTML = `
    <div class="page-hdr"><h1>Danger Zone</h1><p>Irreversible actions — use with care</p></div>
    <div class="form-card" style="border-color:var(--red)">
      <h3 style="color:var(--red)">Wipe all data</h3>
      <p>Permanently deletes every booking, review, expense, and blocked date. This cannot be undone. Type <strong>DELETE</strong> below to confirm.</p>
      <div class="form-row" style="grid-template-columns:1fr auto">
        <div class="field"><label>Confirm</label><input type="text" id="wipe-confirm" placeholder="Type DELETE"/></div>
        <button class="btn-sm" style="background:var(--red)" onclick="wipeData()">Wipe All Data</button>
      </div>
      <div class="form-msg" id="wipe-msg"></div>
    </div>`;
}

async function wipeData() {
  const val = document.getElementById('wipe-confirm').value.trim();
  const msg = document.getElementById('wipe-msg');
  if (val !== 'DELETE') { msg.className = 'form-msg fail'; msg.textContent = 'Type DELETE exactly to confirm.'; msg.style.display = 'block'; return; }
  try {
    const r = await fetch(API + '/api/wipe-data?password=' + encodeURIComponent(pwd), { method: 'POST' });
    const data = await r.json();
    if (data.success) {
      bookings = []; feedback = []; expenses = [];
      msg.className = 'form-msg ok'; msg.textContent = 'All data wiped.'; msg.style.display = 'block';
      setTimeout(() => showPage('overview', document.querySelector('.nav-item')), 800);
    } else { msg.className = 'form-msg fail'; msg.textContent = data.error || 'Failed.'; msg.style.display = 'block'; }
  } catch (e) { msg.className = 'form-msg fail'; msg.textContent = 'Connection error.'; msg.style.display = 'block'; }
}

function logout() {
  API_RESET();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('pwd').value = '';
  document.getElementById('err').style.display = 'none';
  document.getElementById('login-btn').textContent = 'Access Dashboard';
  document.getElementById('login-btn').disabled = false;
}
function API_RESET() { pwd = ''; stats = null; bookings = []; feedback = []; expenses = []; }
</script>
</body>
</html>
